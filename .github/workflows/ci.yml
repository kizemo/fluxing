name: CI

on:
  push:
    branches:
      - '*'
    tags:
      - '[0-9]+.*'
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          # depth 2 so that the lint script can diff against HEAD~1 (the
          # previous commit of a push, or the base tip of a pull_request).
          fetch-depth: 2

      - name: Install clang-format 18
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          wget https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo gpg --dearmor < llvm-snapshot.gpg.key > /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | sudo tee /etc/apt/sources.list.d/llvm-toolchain-jammy-18.list
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format
          clang-format --version

      # The lint gate checks ONLY the C/C++ files this push touched.
      #
      # A whole-tree lint had been red since the brand fork: the fork added
      # files written with a 4-space indent that were never run through
      # clang-format. Because `build` needs `lint`, that red lint skipped
      # build -> test -> sandbox-gate, i.e. the gates were wired up but never
      # actually ran. Touching a file now obliges you to keep it clean; the
      # pre-existing debt is reported separately and does not block.
      - name: Code style lint (changed C/C++ files only)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash ./scripts/lint-changed-cpp.sh

      - name: Code style debt report (non-blocking)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: bash ./scripts/lint-changed-cpp.sh --all --report-only

  build:
    needs: lint
    runs-on: windows-2022
    env:
      boost_version: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
      SDKVER: 10.0.19041.0
    strategy:
      matrix:
        variant: [msbuild, xmake]
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags

      - name: Configure build environment
        shell: bash
        run: |
          cp env.vs2022.bat env.bat
          echo git_ref_name="$(git describe --always)" >> $GITHUB_ENV

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ./install_boost.bat
          ./build.bat boost arm64

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          sdk: ${{ env.SDKVER }}

      # bundled winsparkle v0.9.2 to disable auto open ReleaseNoteUrl in default browser
      - name: cache bundled winsparkle
        id: cache-winsparkle
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\winsparkle\x64\Release\WinSparkle.dll
            ${{ github.workspace }}\winsparkle\x64\Release\WinSparkle.lib
            ${{ github.workspace }}\winsparkle\Release\WinSparkle.dll
            ${{ github.workspace }}\winsparkle\Release\WinSparkle.lib
          key: ${{ runner.os }}-winsparkle-v0.9.2-bundled
          restore-keys: |
            winsparkle-v0.9.2-bundled

      - name: Build bundled winsparkle
        if: steps.cache-winsparkle.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path winsparkle) { Remove-Item -Recurse -Force winsparkle }
          # Clone winsparkle repo v0.9.2
          git clone https://github.com/vslavik/winsparkle.git -b v0.9.2 --depth 1
          cd winsparkle
          git submodule update --init --recursive
          copy ..\bundled_winsparkle.patch .
          git apply bundled_winsparkle.patch
          nuget restore
          msbuild -m -t:Build -p:Configuration=Release -p:Platform=x64 WinSparkle.sln
          msbuild -m -t:Build -p:Configuration=Release -p:Platform=Win32 WinSparkle.sln

      - name: Install WinSparkle files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          copy .\winsparkle\x64\Release\WinSparkle.dll .\output\
          copy .\winsparkle\x64\Release\WinSparkle.lib .\lib64\
          copy .\winsparkle\Release\WinSparkle.dll .\output\Win32\
          copy .\winsparkle\Release\WinSparkle.lib .\lib\

      - name: Get Rime files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\get-rime.ps1 -use dev

      - name: Build data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.bat data

      - name: Setup xmake
        if: matrix.variant == 'xmake'
        uses: xmake-io/github-action-setup-xmake@v1

      # The Weasel* projects link yaml-cpp.lib out of the librime deps build
      # tree, and build.bat refuses to continue until that file exists. The
      # CI inherited from upstream never built the librime deps (upstream does
      # not link yaml-cpp), so the build stopped with "the librime dependency
      # libraries are not built yet". The lint wall had been hiding this since
      # the brand fork -- see lessons-learned.md L132.
      - name: Build librime and its dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.bat rime

      - name: Build Weasel
        shell: pwsh
        id: build_weasel
        env:
          RELEASE_BUILD: ${{ (github.repository == 'rime/weasel' && startsWith(github.ref, 'refs/tags/')) && '1' || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ matrix.variant }}' -eq 'msbuild') {
            .\build.bat arm64 installer
          } else {
            .\xbuild.bat arm64 installer
          }

      - name: Compress Debug Symbols
        if: matrix.variant == 'msbuild'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          output\7z.exe a -t7z "./output/archives/debug_symbols.7z" "output/*.pdb" -r

      - name: Upload artifacts
        if: matrix.variant == 'msbuild'
        uses: actions/upload-artifact@v4
        with:
          name: weasel-artifact-${{ env.git_ref_name }}
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe
            .\output\archives\debug_symbols.7z

      # The sandbox gate needs the installer itself and the build output,
      # because one of its assertions is "the TIP the installer registered is
      # byte-identical to this build" (P2.2) and the unit tests read
      # output\data\*.yaml through the buildout mount.
      - name: Upload the installer for the sandbox gate
        if: matrix.variant == 'msbuild'
        uses: actions/upload-artifact@v4
        with:
          name: fluxing-installer
          if-no-files-found: error
          path: .\output\archives\fluxing-*-installer.exe

      - name: Upload the build output for the sandbox gate
        if: matrix.variant == 'msbuild'
        uses: actions/upload-artifact@v4
        with:
          name: fluxing-buildout
          if-no-files-found: error
          path: |
            .\output\weasel*.dll
            .\output\data

      # Release-only steps (run on tags or master)
      - name: Extract changelog
        if: ${{ github.repository == 'rime/weasel' && startsWith(github.ref, 'refs/tags/') && matrix.variant == 'msbuild' }}
        shell: pwsh
        run: .\extract_changelog.ps1

      - name: Create Nightly release
        if: ${{ github.repository == 'rime/weasel' && github.ref == 'refs/heads/master' && matrix.variant == 'msbuild' }}
        uses: 'marvinpinto/action-automatic-releases@latest'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: latest
          prerelease: true
          title: "Nightly Build"
          files: |
            ./output/archives/weasel*.exe
            ./output/archives/debug_symbols.7z

      - name: Release (stable)
        if: ${{ github.repository == 'rime/weasel' && startsWith(github.ref, 'refs/tags/') && matrix.variant == 'msbuild' }}
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ./output/archives/weasel*.exe
            ./output/archives/debug_symbols.7z
          body_path: ${{ github.workspace }}/RELEASE_CHANGELOG.md


  test:
    needs: build
    runs-on: windows-2022
    env:
      boost_version: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
      SDKVER: 10.0.19041.0
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Configure build environment
        shell: bash
        run: cp env.vs2022.bat env.bat

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ./install_boost.bat
          ./build.bat boost arm64

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          sdk: ${{ env.SDKVER }}

      # spec 015 (2026-07-02): use scripts\run-tests.bat to build + run all 4
      # test projects in one documented call. Per spec 015 sec 2.2, the
      # script passes explicit /p:SolutionDir= to msbuild to work around
      # the standalone-build SolutionDir-resolution issue, and uses
      # if !errorlevel! NEQ 0 (delayed expansion) to correctly detect
      # negative Windows STATUS codes (e.g. 0xC0000005 from BOOST_ASSERT
      # abort). See L22.
      - name: Build + run all test projects
        shell: cmd
        run: scripts\run-tests.bat

      # The sandbox gate runs the same test executables inside the sandbox.
      - name: Upload the test executables for the sandbox gate
        uses: actions/upload-artifact@v4
        with:
          name: fluxing-tests
          if-no-files-found: error
          path: .\Release\Test*.exe


  # ===================================================================
  # The authoritative gate (AGENTS.md "The authoritative gate").
  #
  # Windows Sandbox is itself a nested virtual machine, so it needs a
  # runner with nested virtualization. GitHub-hosted windows runners do not
  # provide that, so this job targets a SELF-HOSTED runner carrying the
  # `sandbox` label:
  #
      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          # depth 2 so that the lint script can diff against HEAD~1 (the
          # previous commit of a push, or the base tip of a pull_request).
          fetch-depth: 2
  # The probe below turns "this runner cannot run the gate" into a loud
  # failure instead of a silent green -- a green that never ran anything is
  # worse than a red one.
  # ===================================================================
  sandbox-gate:
    needs: [build, test]
    runs-on: [self-hosted, windows, x64, sandbox]
    # Bounded on purpose: if no runner carries the `sandbox` label, the job
    # waits for a runner instead of running -- which is the honest outcome
    # (a gate that silently did not run is worse than a red one), but it
    # must not wait forever once a runner does pick it up.
    timeout-minutes: 90
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Download the installer
        uses: actions/download-artifact@v4
        with:
          name: fluxing-installer
          path: output/archives

      - name: Download the build output
        uses: actions/download-artifact@v4
        with:
          name: fluxing-buildout
          path: output

      - name: Download the test executables
        uses: actions/download-artifact@v4
        with:
          name: fluxing-tests
          path: Release

      - name: Probe the Windows Sandbox capability
        shell: pwsh
        run: ./scripts/sandbox-gate/probe-sandbox.ps1

      - name: Run the sandbox gate
        shell: cmd
        run: scripts\sandbox-gate\run-verify.cmd -RepoRoot %GITHUB_WORKSPACE%

      - name: Upload the gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-claims
          if-no-files-found: warn
          path: |
            ~/sandbox-artifacts/rime/logs
            ~/sandbox-artifacts/rime/claims.json