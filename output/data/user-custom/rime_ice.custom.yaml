# 小鹤 rime_ice 用户方案覆盖
# encoding: utf-8
#
# 标准中文键盘布局修复（2026-06-23）：
#   , → ，          Shift+, → 《
#   . → 。          Shift+. → 》
#   / → 、          Shift+/ → ？
#   ; → ；          Shift+; → ：
#   ' → '           Shift+' → "
#   \ → 、          Shift+\ → |
#   [ → 【          Shift+[ → {
#   ] → 】          Shift+] → }
#
# 实现策略：
#   1. punctuator/half_shape patch —— 覆盖默认映射（rime_ice 默认 .→… 不符合中文标准键盘布局）
#   2. key_binder/bindings + Shift+key accept —— Shift+标点被 rime key_binder 拦截后，
#      直接 commit 期望字符（绕过 Punctuator，因为 Punctuator 用 unshifted key）
#
# 注意：librime Punctuator (librime/src/rime/gear/punctuator.cc) 用 unshifted
# ASCII 作为 mapping key，对 Shift mask 不感知。因此直接按的标点用
# punctuator/half_shape patch，Shift+标点用 key_binder send 拦截。
#
# 【L-## librime patch 优先级陷阱】rime_ice 源 schema 的 punctuator.half_shape
# 用 __include 指令从 default.yaml 引入。librime 的 DependencyPriority 是
# kPatch=2 > kInclude=1，所以 patch 比 include 先执行。patch 时 half_shape
# 还是 __include 字符串，dict-merge 静默失败 → patch 完全无效。
# 修复：patch 里重述 __include + overrides，__include 解析阶段会自动把
#       overrides 与 default:/punctuator/half_shape 内容合并。
# 验证证据：v0.19.0.59 (commit 1c0d711) 第一次迁移 rime_ice.custom.yaml 到
#          active dir 后，按 / 仍然输出 / (bug 表现)；本文件改用本语法后
#          build/rime_ice.schema.yaml 的 punctuator/half_shape 才出现覆盖。

patch:
  # 直接按的标点：覆盖 default.yaml 的 half_shape
  # 必须重述 __include: default:/punctuator/half_shape，否则 patch 被丢弃
  punctuator/half_shape:
    __include: default:/punctuator/half_shape
    ',': '，'        # 直接 , → ，
    '.': '。'        # 直接 . → 。
    '/': '、'        # 直接 / → 、（user 主要诉求）
    ';': '；'        # 直接 ; → ；
    "'": "'"        # 直接 ' → '
    "\\": '、'       # 直接 \ → 、（rime 字符串需要转义反斜杠）
    '[': '【'        # 直接 [ → 【
    ']': '】'        # 直接 ] → 】

  # Shift+标点：key_binder 拦截后 send 期望字符
  # 顺序：使用 bindings/+ 追加，不影响现有 has_menu bindings
  # when: always —— 中文模式下 Shift+标点应该总是 commit
  # accept: Shift+key 语法：rime 中 Shift+comma 等价于物理键 Shift+, 触发的 keyevent
  #
  # L113: 原来这里还有 4 条 send 写中文全角字符（《》？！：）的绑定
  #   （Shift+, / Shift+. / Shift+/ / Shift+;）。**librime 的 key_binder 的 send:
  #   必须是按键名，不接受字符** —— 多字节 UTF-8 解析失败后整条绑定被丢弃：
  #     key_event.cc:77  parse error: unrecognized key
  #     key_binder.cc:191 invalid key binding #N, with invalid send pattern
  #   ⇒ 这 4 个快捷键**从来没有生效过**，而且每次引擎启动都会刷 4 行错误日志。
  #   （env.bat 里从 v0.21.0.1 起就记着这条 known issue，一直没修。）
  #   现已移除。移除后行为不变：绑定本来就被 librime 丢弃，Shift+, 仍由
  #   punctuator/half_shape 处理成「，」。
  #
  # 为什么不用别的办法实现「Shift+标点 → 中文符号」：librime 1.13 没有这条原生路径
  #   - gear/punctuator.cc 的 ProcessKeyEvent 只取 key_event.keycode()，
  #     **完全不看 Shift 修饰键** ⇒ punctuator 无法区分 , 与 Shift+,；
  #   - gear/ascii_composer.cc 只有 good_old_caps_lock 与 switch_key，
  #     **没有 key→文本映射规则**。
  #   要实现只能改 librime（本项目禁止，P3）或另开一条链路，属后续立项。
  #
  # 保留的 4 条：send 是单个 ASCII 字符，librime 能解析，实际生效。
  key_binder/bindings/+:
    - { when: always, accept: "Shift+apostrophe", send: '"' }
    - { when: always, accept: "Shift+backslash", send: "|" }
    - { when: always, accept: "Shift+bracketleft", send: "{" }
    - { when: always, accept: "Shift+bracketright", send: "}" }