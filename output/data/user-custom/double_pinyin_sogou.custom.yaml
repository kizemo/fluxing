# 搜狗双拼 用户方案覆盖
# encoding: utf-8
#
# 同步 rime_ice.custom.yaml 的标点修复（8 标点 + Shift 配对）
# 同源 schema 都用 __include 引入 default:/punctuator/half_shape,
# librime patch 优先级 kPatch=2 > kInclude=1 → patch 时 half_shape 还是
# __include 字符串, dict-merge 静默失败。必须重述 __include + overrides。
# 详见 rime_ice.custom.yaml 注释段 + .specify/memory/lessons-learned.md L-##

patch:
  # 直接按的标点：覆盖 default.yaml 的 half_shape
  punctuator/half_shape:
    __include: default:/punctuator/half_shape
    ',': '，'        # 直接 , → ，
    '.': '。'        # 直接 . → 。
    '/': '、'        # 直接 / → 、
    ';': '；'        # 直接 ; → ；
    "'": "'"        # 直接 ' → '
    "\\": '、'       # 直接 \ → 、
    '[': '【'        # 直接 [ → 【
    ']': '】'        # 直接 ] → 】

  # Shift+ 标点：key_binder 拦截后 send 期望字符
  # 顺序：使用 bindings/+ 追加，不影响现有 has_menu bindings
  # when: always —— 中文模式下 Shift+标点应该总是 commit
  #
  # ADR 0009：accept 里带修饰符时，写的是**这个组合键产生的字符的键名**，
  #   不是物理键的键名。TSF 前端对可打印键走 ToUnicodeEx，发给 librime 的是
  #   **产生的字符**（WeaselTSF/KeyEvent.cpp:51），librime 又按 (keycode, modifier)
  #   精确匹配（key_event.h:43），两边字面对上才可能触发：
  #     Shift+'   → 前端发 0x22 → accept 写 Shift+quotedbl  （不是 Shift+apostrophe）
  #     Shift+\   → 前端发 0x7C → accept 写 Shift+bar       （不是 Shift+backslash）
  #     Shift+[   → 前端发 0x7B → accept 写 Shift+braceleft  （不是 Shift+bracketleft）
  #     Shift+]   → 前端发 0x7D → accept 写 Shift+braceright （不是 Shift+bracketright）
  #   旧写法要的是 0x27/0x5C/0x5B/0x5D，跟前端实际发送的对不上 ⇒ 这 4 条绑定
  #   **从来没有触发过**（ADR 0009 / L149）。
  #
  # send: 必须是**单个 ASCII 字符**。librime 的 KeyEvent::Parse 对长度为 1 的串
  #   直接取字符码（key_event.cc:56-57），所以 '"' / '|' / '{' / '}' 都合法；
  #   多字节 UTF-8 会走键名分支查不到 ⇒ 整条绑定被丢弃并刷错误日志。
  #
  # L113: 原来这里还有 4 条 send 写中文全角字符（《》？！：）的绑定
  #   （Shift+, / Shift+. / Shift+/ / Shift+;），正是上面「send 必须是单个 ASCII
  #   字符」这条原因，librime 解析失败后整条绑定被丢弃：
  #     key_event.cc:77  parse error: unrecognized key
  #     key_binder.cc:191 invalid key binding #N, with invalid send pattern
  #   ⇒ 这 4 个快捷键**从来没有生效过**，而且每次引擎启动都会刷 4 行错误日志。
  #   （env.bat 里从 v0.21.0.1 起就记着这条 known issue，一直没修。）
  #   现已移除。移除后行为不变：绑定本来就被 librime 丢弃，Shift+, 仍由
  #   punctuator/half_shape 处理成「，」。
  #
  # 为什么不用别的办法实现「Shift+标点 → 中文符号」：librime 1.13 没有这条原生路径
  #   - gear/punctuator.cc 的 ProcessKeyEvent 只取 key_event.keycode()，
  #     **完全不看 Shift 修饰键** ⇒ punctuator 无法区分 , 与 Shift+,；
  #   - gear/ascii_composer.cc 只有 good_old_caps_lock 与 switch_key，
  #     **没有 key→文本映射规则**。
  #   要实现只能改 librime（本项目禁止，P3）或另开一条链路，属后续立项。
  #
  # 4 条都要留着：accept 写字符键名、send 是单个 ASCII 字符，两头都能被 librime 解析。
  key_binder/bindings/+:
    - { when: always, accept: "Shift+quotedbl", send: '"' }
    - { when: always, accept: "Shift+bar", send: "|" }
    - { when: always, accept: "Shift+braceleft", send: "{" }
    - { when: always, accept: "Shift+braceright", send: "}" }
