# 缺陷 ⇄ 回归用例 登记表
#
# 规则（L0 门禁 test/regression/lib 会校验，见 scripts/gate/L0-static.ps1 的 defects-registry 项）：
#   1. 每个 status=guarded 的缺陷，guard.case 必须指向一个真实存在的 cases/C####-*.ps1
#   2. 每个 cases/*.ps1 必须被至少一个条目引用（不许有孤儿用例）
#   3. 用例文件内不得出现 tmp/ 路径（tmp 被 git-ignore，等于资产丢失）
#
# 字段说明：
#   id        缺陷编号（D + 四位序号，与用例 C#### 对齐，便于互查）
#   class     缺陷类别：behavior-regression（功能回退）/ installer / build-metadata
#   status    guarded（有用例守）/ unguarded（已知无守护，禁止长期停留）/ wontfix-with-reason
#   fixed_ref 修复的可追溯锚点：ADR / lesson / 提交 / 发布版本
#   symptom   用户可观察到的现象（写现象，不写实现）
#   guard     守它的用例：case / level(fast|heavy|manual) / needs / last_verified
schema: 1
updated: 2026-11-06

defects:
  - id: D0032
    title: 按 Esc 关闭「用户短语」窗口时，快捷设置栏被连带收起
    class: behavior-regression
    status: guarded
    fixed_ref: "ADR 0032 (docs/adr/0032-own-ui-client-identity-not-focus-order.md) / v1.1.8 / commit 2cece41"
    lesson: [L171, L172]
    symptom: >
      打开「用户短语」界面 → 按 Esc 关掉它 → 快捷设置栏跟着消失。
      根因是自家 UI 进程销毁时发出的 profile 事件与「用户真的切走输入法」同形，
      按焦点顺序判别必然两头都错，只能改成按 IPC 会话的客户端身份判别。
    guard:
      case: C0032
      level: heavy
      needs: [installed-product, deployed-server-from-build, hotkey-9002]
      last_verified: "2026-11-03"
    note: >
      真机 UI 探针（probes/ReproEsc.cs）分三阶段归因：A 不按 Esc 的对照、
      B Esc 归因窗、C 反向（真切走输入法必须收起）。缺任一阶段结论都不可信。

  - id: D0174
    title: 安装报「无法打开要写入的文件：FluxingPhrasesDialog.exe」，升级装不上
    class: installer
    status: guarded
    fixed_ref: "L174 (lessons-learned) / install.nsi 4 处按映像名清理 / v1.1.9"
    lesson: [L174]
    symptom: >
      交互安装时弹出「无法打开要写入的文件」，安装中止；文件没被换掉。
      根因是上一代自家 UI 子进程在 server 被强杀后成了孤儿，
      目标 exe 被独占锁；旧的清理只认活着的进程树（taskkill /T），打不到孤儿。
    guard:
      case: C0174
      level: heavy
      needs: [old-installer, new-installer, protected-install-dir]
      last_verified: "2026-11-03"
    note: >
      判据不认安装器退出码（NSIS 静默模式会吞掉 File 失败并仍返回 0）：
      必须比对「落盘 sha256 == 构建产物」+「卸载注册表 DisplayVersion 已写到尾」。
      反向对照是硬要求：同一场景下旧安装器必须失败，否则复现是假阳性。

  - id: D0175
    title: PE 版本资源 FileVersion 恒为空 ⇒ AGENTS.md §4.3 的版本核验门禁形同虚设
    class: build-metadata
    status: guarded
    fixed_ref: "L175 (lessons-learned) / 10 处 rc 改 STRZ(FILE_VERSION) / v1.1.9"
    lesson: [L175]
    symptom: >
      `(Get-Item output\Win32\WeaselServer.exe).VersionInfo.FileVersion` 长期返回空串，
      门禁命令跑得通、断言永远不成立。PE 固定版本信息（VS_FIXEDFILEINFO）其实是对的，
      错在字符串表：rc 里写 `VALUE "FileVersion", FILE_VERSION` 展开成无引号数字，存不进字符串表。
    guard:
      case: C0175
      level: fast
      needs: [build-output]
      last_verified: "2026-11-03"
    note: >
      三层取证缺一不可：① 直接解析 VS_FIXEDFILEINFO；② .NET VersionInfo.FileVersion；
      ③ 两者一致。只验一层会被掩盖（本轮就是这么被掩盖了一整轮的）。

  - id: D0176
    title: 快捷设置栏被拖到屏幕外后位置被持久化 ⇒ 该进程内 Alt+, 再也调不出面板（体感「时好时坏」）
    class: behavior-regression
    status: guarded
    fixed_ref: "L193 (lessons-learned) / QuickPanelDialog::SavePosition 落盘守卫 + Show() 复用路径自愈"
    lesson: [L193]
    symptom: >
      快捷设置栏被拖到显示器可见区域之外后，坐标会被写进用户目录的 quickpanel.position；
      本进程内再按 Alt+,，面板「显示成功」但整块落在屏幕外，用户体感仍是「设置栏又消失了」。
      把服务端重启一次，首建钳制又把它拉回屏内，于是表现为时好时坏。
    guard:
      case: C0176
      level: fast
      needs: [build-output, test-binary-quickpanel]
      last_verified: "2026-11-06"
    note: >
      用例是单元级 + 结构级守卫（RectIntersectsVisibleArea 存在性、SavePosition 落盘守卫接线、
      Show() 复用路径自愈调用、TestQuickPanelDialog 全绿），不替代真机复验；真机复验步骤见 handoff。
      判据口径固定为「物理 rect 与 rcMonitor / rcWork 同坐标系比较 + on_screen_px」，
      探针必须先 SetThreadDpiAwarenessContext(-4)（PMv2）。vis=True 只代表 WS_VISIBLE，不等于用户能看见。

  - id: D0177
    title: 候选词删除快捷键（Ctrl+Shift+数字 / Shift+Ctrl+数字）失效，且按下第二个修饰键时候选窗消失
    class: behavior-regression
    status: guarded
    fixed_ref: "L190 + L192 (lessons-learned) / default.yaml ascii_composer.switch_key 四键 noop / KeyEventSink 拦截门 / commit fde34a1"
    lesson: [L190, L192]
    symptom: >
      有候选窗时按 Ctrl+Shift+数字（或 Shift+Ctrl+数字）删不掉候选词；按下第二个修饰键时候选窗直接消失。
      两层阻断叠加：ascii_composer 抢走第二个修饰键 ⇒ 面板不可见；拦截门又在面板不可见时必然返回 0。
    guard:
      case: C0177
      level: fast
      needs: [build-output, test-binary-candidate-delete]
      last_verified: "2026-11-06"
    note: >
      四颗齿：头文件 API 存在、KeyEventSink 接线未断、default.yaml 的 switch_key 四键仍为 noop、
      TestCandidateRButtonDown 全绿。managed 的 default.yaml 被后续 spec 覆写是本缺陷的复发通道，
      齿 3 专为它设。单元级守卫不替代真机复验（用户物理按键矩阵见 handoff 对应章节）。
