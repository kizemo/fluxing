<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>QuickPanel v5 — Branded Bento Grid (2×3)</title>
<style>
  :root {
    --bg: rgb(255, 255, 255);
    --bg-hover: rgba(0,0,0,0.04);
    --bg-pressed: linear-gradient(135deg, #FF5F31 0%, #9B51E0 100%);
    --fg: rgb(28, 28, 30);
    --fg-dim: rgba(60, 60, 67, 0.7);
    --radius-card: 20px;
    --radius-tile: 14px;
    --accent: rgb(255, 95, 49);
    --accent-2: rgb(155, 81, 224);
  }
  body {
    margin: 0;
    background: linear-gradient(135deg, #fff5e8 0%, #f0e8ff 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "PingFang SC", sans-serif;
    color: var(--fg);
  }
  /* v5: Bento Grid — 2行3列,Fluxing logo 占左上角(2倍大),其它 5 按钮在右侧 */
  .qp {
    background: var(--bg);
    border-radius: var(--radius-card);
    padding: 10px;
    box-shadow:
      0 12px 32px rgba(0,0,0,0.10),
      0 2px 6px rgba(0,0,0,0.04);
    display: grid;
    grid-template-columns: 64px 1fr 1fr;
    grid-template-rows: 64px 64px;
    gap: 8px;
    width: 280px;
  }
  /* Fluxing logo: 占左侧整列第 1 行,即 grid(1,1) 占 (1,1)+(2,1) */
  .qp .brand {
    grid-column: 1; grid-row: 1 / 3;
    border-radius: var(--radius-tile);
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: white;
    gap: 2px;
    box-shadow: 0 2px 8px rgba(155, 81, 224, 0.30);
  }
  .qp .brand svg { width: 28px; height: 28px; }
  .qp .brand .name { font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }

  /* 5 个按钮:每格 1 个,填满右 2 列 × 2 行 */
  .qp button {
    border: 0;
    border-radius: var(--radius-tile);
    background: rgba(0,0,0,0.02);
    color: var(--fg-dim);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: background-color 200ms, color 200ms;
    gap: 4px;
  }
  .qp button:hover { background: var(--bg-hover); color: var(--fg); }
  .qp button[aria-pressed="true"] {
    background: var(--bg-pressed);
    color: white;
  }
  .qp button svg { width: 20px; height: 20px; }
  .qp button .lbl { font-size: 10px; line-height: 1; }

  .annotate {
    position: fixed; bottom: 16px; left: 16px;
    background: rgba(0,0,0,0.55); color: white;
    padding: 8px 12px; border-radius: 8px;
    font-size: 12px; max-width: 480px;
    line-height: 1.5;
  }
  code { font-family: ui-monospace, Menlo, monospace; background: rgba(255,255,255,0.10); padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
  <div class="qp" role="toolbar" aria-label="Fluxing 快速面板 v5">
    <button class="brand" aria-label="Fluxing 火流猩 状态">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 4 L11 16 L5 16 L9 4 Z M13 4 L19 16 L13 16 L17 4 Z"/>
        <circle cx="20" cy="18" r="2" fill="white" stroke="none"/>
      </svg>
      <span class="name">Fluxing</span>
    </button>

    <button aria-label="方案" title="方案 — 切换 RIME 输入方案(占位)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4" width="16" height="16" rx="3"/>
        <path d="M8 8 H16 M8 12 H16 M8 16 H13"/>
      </svg>
      <span class="lbl">方案</span>
    </button>

    <button aria-label="自定义短语" title="自定义短语(占位)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 5 H15 L18 8 V19 H5 Z"/>
        <path d="M8 11 H15 M8 14 H13"/>
      </svg>
      <span class="lbl">短语</span>
    </button>

    <button aria-label="符号" title="符号(占位)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 6 L6 12 L8 18 M16 6 L18 12 L16 18"/>
        <circle cx="12" cy="12" r="1.2" fill="currentColor"/>
      </svg>
      <span class="lbl">符号</span>
    </button>

    <button aria-label="设置" title="设置(占位)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 3 L12 5 M12 19 L12 21 M3 12 L5 12 M19 12 L21 12 M5.5 5.5 L7 7 M17 17 L18.5 18.5 M5.5 18.5 L7 17 M17 7 L18.5 5.5"/>
      </svg>
      <span class="lbl">设置</span>
    </button>

    <button aria-label="账号" title="账号(占位)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="3.2"/>
        <path d="M5 20 C5 16 8 14 12 14 C16 14 19 16 19 20"/>
      </svg>
      <span class="lbl">账号</span>
    </button>
  </div>

  <div class="annotate">
    <strong>v5 · Branded Bento Grid (2×3)</strong><br>
    技术栈:<code>ID2D1HwndRenderTarget</code> + <code>D2D1::LinearGradientBrush</code> + <code>IDWriteTextFormat</code><br>
    避雷:logo + 5 按钮全部是 D2D 几何,无 GDI+ Bitmap;布局用 Grid (CSS Grid 同等概念,D2D 用 manual layout)。<br>
    尺寸:280 × 138 px;Fluxing 品牌占左侧整列,5 按钮在右 2×3 网格<br>
    适合:把 Fluxing 品牌 logo 当第一公民,显性露出"我在用什么输入法"
  </div>
</body>
</html>
