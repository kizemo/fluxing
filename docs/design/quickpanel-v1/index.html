<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>QuickPanel v1 — macOS Big Sur 透明胶囊</title>
<style>
  :root {
    /* L70-FIX: 全部颜色和尺寸用 CSS 变量,实现时映射到 D2D1::ColorF,避开 GDI+ Bitmap */
    --bg: rgba(255, 255, 255, 0.72);
    --bg-fallback: rgb(245, 245, 247);
    --bg-dark: rgba(40, 40, 42, 0.72);
    --bg-dark-fallback: rgb(28, 28, 30);
    --fg: rgb(28, 28, 30);
    --fg-dim: rgba(60, 60, 67, 0.6);
    --accent: rgb(255, 95, 49);
    --accent-2: rgb(155, 81, 224);
    --radius-pill: 22px;
    --shadow-soft: 0 8px 24px rgba(0,0,0,0.10);
  }
  body {
    margin: 0;
    background: linear-gradient(135deg, #ffd9b3 0%, #c5b8e8 60%, #b8c5e8 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "PingFang SC", sans-serif;
    color: var(--fg);
  }
  .dark-bg { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }

  /* v1 panel: 透明胶囊,横排 6 入口 + Fluxing 品牌 logo */
  .qp {
    background: var(--bg);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: var(--radius-pill);
    padding: 6px 8px;
    box-shadow: var(--shadow-soft);
    display: flex; align-items: center; gap: 4px;
    /* 降级(无 backdrop-filter 支持时) */
    background-color: var(--bg-fallback);
  }
  @supports (backdrop-filter: blur(20px)) or (-webkit-backdrop-filter: blur(20px)) {
    .qp { background-color: var(--bg); }
  }
  .qp.dark { background-color: var(--bg-dark); border-color: rgba(255,255,255,0.08); color: white; }

  /* logo 区,跟其它按钮视觉上独立,但形态相似 */
  .qp .brand {
    width: 32px; height: 32px;
    margin-right: 4px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .qp .brand svg { width: 18px; height: 18px; }

  /* 通用按钮:32x32 hover 高亮 */
  .qp button {
    width: 32px; height: 32px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--fg-dim);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
    transition: background-color 120ms, color 120ms;
  }
  .qp button:hover { background: rgba(0,0,0,0.06); color: var(--fg); }
  .qp.dark button:hover { background: rgba(255,255,255,0.10); color: white; }
  .qp button svg { width: 18px; height: 18px; }
  .qp button[aria-pressed="true"] { color: var(--accent); }
  .qp button[aria-pressed="true"] svg { stroke-width: 2.4; }

  /* 分隔条(可选,让 logo 与按钮组更分明) */
  .qp .sep { width: 1px; height: 18px; background: rgba(0,0,0,0.08); flex-shrink: 0; margin: 0 2px; }
  .qp.dark .sep { background: rgba(255,255,255,0.12); }

  /* 紧凑尺寸:6 按钮 + logo + padding ≈ 280px × 44px */
  .qp { width: max-content; }

  /* 提示条 */
  .annotate {
    position: fixed; bottom: 16px; left: 16px;
    background: rgba(0,0,0,0.55); color: white;
    padding: 8px 12px; border-radius: 8px;
    font-size: 12px; max-width: 480px;
    line-height: 1.5;
  }
  code { font-family: ui-monospace, Menlo, monospace; background: rgba(255,255,255,0.10); padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
  <div class="qp" role="toolbar" aria-label="Fluxing 快速面板 v1">
    <!-- 品牌 logo (GradientIcon) -->
    <button class="brand" aria-label="Fluxing 火流猩 (关于 / 状态)">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 4 L11 16 L5 16 L9 4 Z M13 4 L19 16 L13 16 L17 4 Z"/>
        <circle cx="20" cy="18" r="2" fill="white" stroke="none"/>
      </svg>
    </button>
    <div class="sep" aria-hidden="true"></div>

    <!-- 1. 方案 (占位) -->
    <button aria-label="方案" aria-pressed="false" title="方案 — 切换 RIME 输入方案(占位)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4" width="16" height="16" rx="3"/>
        <path d="M8 8 H16 M8 12 H16 M8 16 H13"/>
      </svg>
    </button>

    <!-- 2. 短语 (占位) -->
    <button aria-label="自定义短语" aria-pressed="false" title="自定义短语 — 用户词库(占位)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 5 H15 L18 8 V19 H5 Z"/>
        <path d="M8 11 H15 M8 14 H13"/>
      </svg>
    </button>

    <!-- 3. 符号 (占位) -->
    <button aria-label="符号" aria-pressed="false" title="符号 — 标点符号方案(占位)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 6 L6 12 L8 18 M16 6 L18 12 L16 18"/>
        <circle cx="12" cy="12" r="1.2" fill="currentColor"/>
      </svg>
    </button>

    <!-- 4. 设置 (占位) -->
    <button aria-label="设置" aria-pressed="false" title="设置 — 打开 Fluxing 设置面板(占位)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 3 L12 5 M12 19 L12 21 M3 12 L5 12 M19 12 L21 12 M5.5 5.5 L7 7 M17 17 L18.5 18.5 M5.5 18.5 L7 17 M17 7 L18.5 5.5"/>
      </svg>
    </button>

    <!-- 5. 账号 (占位) -->
    <button aria-label="账号" aria-pressed="false" title="账号 — 登录/同步(占位,未来云同步)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="3.2"/>
        <path d="M5 20 C5 16 8 14 12 14 C16 14 19 16 19 20"/>
      </svg>
    </button>
  </div>

  <div class="annotate">
    <strong>v1 · macOS Big Sur 透明胶囊</strong><br>
    技术栈:<code>ID2D1HwndRenderTarget</code> + <code>D2D1::RadialGradientBrush</code> + <code>DwmExtendFrameIntoClientArea</code> 开启毛玻璃<br>
    避雷:<strong>完全不用 GDI+ Bitmap</strong>。所有几何(D2D RectGeometry/RoundedRectGeometry)在 WM_PAINT 时即时绘制,WM_DESTROY 一次性 Release。<br>
    尺寸:~280 × 44 px,贴右下角工作区<br>
    适合:Mac 风格旗舰 UI,简洁不抢戏
  </div>
</body>
</html>
